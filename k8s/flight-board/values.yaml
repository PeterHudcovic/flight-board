# Values follow docs/contract.md. Required at install time: image.tag.

image:
  registry: europe-west3-docker.pkg.dev/flight-board-prg-2610/flight-board
  # Git SHA of the deployed commit; also exported as FLIGHTBOARD_VERSION. No default on purpose.
  tag: ""
  pullPolicy: IfNotPresent

backend:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 768Mi
  javaToolOptions: "-XX:MaxRAMPercentage=75"

frontend:
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

ingress:
  # Public domain proxied by Cloudflare (Full strict).
  host: flights.peterhudcovic.tech
  staticIpName: flight-board-ip
  tlsSecretName: flight-board-tls

# Secret names and keys (docs/contract.md section 7). Values are never stored in this chart.
secrets:
  aerodatabox:
    name: flight-board-aerodatabox
    key: api-key
  mongodbConnection:
    name: flight-board-mongodb-admin-flightboard-app
    key: connectionString.standard

# ConfigMap flight-board-config (docs/contract.md section 7, GKE values).
config:
  FLIGHTBOARD_SOURCE: "aerodatabox"
  FLIGHTBOARD_MONGODB_DATABASE: "flightboard"
  FLIGHTBOARD_AERODATABOX_BASE_URL: "https://aerodatabox.p.rapidapi.com"
  FLIGHTBOARD_AERODATABOX_HOST: "aerodatabox.p.rapidapi.com"
  FLIGHTBOARD_FETCH_INTERVAL: "PT30M"
  FLIGHTBOARD_FETCH_CHECK_INTERVAL: "PT1M"
  FLIGHTBOARD_FETCH_LOCK_DURATION: "PT5M"
  FLIGHTBOARD_FETCH_RUN_TIMEOUT: "PT2M"
  FLIGHTBOARD_BOARD_STALE_AFTER: "PT75M"
  FLIGHTBOARD_BOARD_MAX_AGE: "PT12H"
  FLIGHTBOARD_SOURCE_AIRPORT: "PRG"
  FLIGHTBOARD_SOURCE_OFFSET_MINUTES: "-60"
  FLIGHTBOARD_SOURCE_DURATION_MINUTES: "720"
  FLIGHTBOARD_BOARD_TERMINAL: "2"
  FLIGHTBOARD_BOARD_MAX_FLIGHTS: "36"
  FLIGHTBOARD_BOARD_TIMEZONE: "Europe/Prague"
  FLIGHTBOARD_ADMIN_PORT: "8082"
  FLIGHTBOARD_ADMIN_ADDRESS: "127.0.0.1"
  SERVER_PORT: "8080"
  MANAGEMENT_SERVER_PORT: "8081"
