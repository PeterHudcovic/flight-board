# MongoDB replica set managed by the MCK operator (docs/contract.md sections 6 and 7).
# Prerequisites: operator installed (CRD exists) and Secret flight-board-mongodb-app-password
# created by the author (see k8s/README.md). Change this resource, never the StatefulSet.
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: flight-board-mongodb
  namespace: flight-board
  labels:
    app.kubernetes.io/part-of: flight-board
spec:
  type: ReplicaSet
  members: 3
  version: "8.0.32"
  security:
    authentication:
      modes: ["SCRAM"]
  users:
    - name: flightboard-app
      db: admin # authentication database
      passwordSecretRef:
        name: flight-board-mongodb-app-password
        key: password
      roles:
        - name: readWrite
          db: flightboard
      # The operator appends "-scram-credentials" to this name.
      scramCredentialsSecretName: flight-board-mongodb-app
      # Generated by the operator; the backend reads key connectionString.standard.
      connectionStringSecretName: flight-board-mongodb-admin-flightboard-app
  additionalMongodConfig:
    storage.wiredTiger.engineConfig.cacheSizeGB: 0.25
  statefulSet:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: flight-board-mongodb
            app.kubernetes.io/part-of: flight-board
        spec:
          affinity:
            podAntiAffinity:
              # One member per node: draining one node never takes two members.
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: flight-board-mongodb
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: mongod
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  memory: 1Gi
      volumeClaimTemplates:
        - metadata:
            name: data-volume
            labels:
              app.kubernetes.io/part-of: flight-board
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: standard-rwo
            resources:
              requests:
                storage: 5Gi
        - metadata:
            name: logs-volume
            labels:
              app.kubernetes.io/part-of: flight-board
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: standard-rwo
            resources:
              requests:
                storage: 2Gi
