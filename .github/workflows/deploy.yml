# Build, push and deploy main to GKE (spec chapter 13, Appendix A2/A7).
# The workflow name "Deploy" is part of the WIF condition for fb-deploy (infra/bootstrap/wif.tf).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deployment at a time; a running deployment is never cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: flight-board-prg-2610
  REGISTRY: europe-west3-docker.pkg.dev/flight-board-prg-2610/flight-board
  CLUSTER: flight-board
  ZONE: europe-west3-a
  NAMESPACE: flight-board
  RELEASE: flight-board
  PUBLIC_URL: https://flights.peterhudcovic.tech
  SHA: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A2: a commit that changes the main infrastructure is deployed only after the author's
      # manual terraform apply, by starting this workflow manually (workflow_dispatch).
      - name: Check for infrastructure changes
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          skip=false
          if [ "$EVENT" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if git diff --name-only "$BEFORE" "$SHA" | grep -q '^infra/terraform/'; then
              skip=true
              echo "::notice::infra/terraform changed. Run terraform apply, then start Deploy manually."
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Detect frontend
        id: frontend
        if: steps.gate.outputs.skip != 'true'
        run: |
          if [ -f app/frontend/Dockerfile ]; then echo "enabled=true"; else echo "enabled=false"; fi >> "$GITHUB_OUTPUT"

      - id: auth
        if: steps.gate.outputs.skip != 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: fb-deploy@flight-board-prg-2610.iam.gserviceaccount.com
          token_format: access_token

      - if: steps.gate.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: europe-west3-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - if: steps.gate.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        if: steps.gate.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: app/backend
          push: true
          tags: ${{ env.REGISTRY }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend
        if: steps.gate.outputs.skip != 'true' && steps.frontend.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          push: true
          tags: ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # A2: the control plane is reached only through the DNS endpoint.
      - if: steps.gate.outputs.skip != 'true'
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.ZONE }}
          project_id: ${{ env.PROJECT_ID }}
          use_dns_based_endpoint: true

      - if: steps.gate.outputs.skip != 'true'
        uses: azure/setup-helm@v4
        with:
          version: v4.1.3

      # A2: never replace a newer deployment with an older commit.
      - name: Check deployed version
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          deployed=$(helm get values "$RELEASE" -n "$NAMESPACE" -o json 2>/dev/null | jq -r '.image.tag // empty' || true)
          echo "Deployed: ${deployed:-none}, new: $SHA"
          if [ -z "$deployed" ] || [ "$deployed" = "$SHA" ]; then exit 0; fi
          if ! git cat-file -e "$deployed^{commit}" 2>/dev/null; then
            echo "::error::Deployed commit $deployed is not in the history of this repository."
            exit 1
          fi
          if git merge-base --is-ancestor "$SHA" "$deployed"; then
            echo "::error::$SHA is older than the deployed $deployed; not deploying."
            exit 1
          fi

      - name: helm upgrade
        if: steps.gate.outputs.skip != 'true'
        env:
          FRONTEND: ${{ steps.frontend.outputs.enabled }}
        run: |
          helm upgrade --install "$RELEASE" k8s/flight-board -n "$NAMESPACE" \
            --set image.tag="$SHA" --set frontend.enabled="$FRONTEND" \
            --wait --timeout 10m

      - name: Wait for rollout
        if: steps.gate.outputs.skip != 'true'
        env:
          FRONTEND: ${{ steps.frontend.outputs.enabled }}
        run: |
          set -euo pipefail
          kubectl rollout status deployment/flight-board-backend -n "$NAMESPACE" --timeout=5m
          if [ "$FRONTEND" = "true" ]; then
            kubectl rollout status deployment/flight-board-frontend -n "$NAMESPACE" --timeout=5m
          fi

      # A7: the public status must report exactly this commit, not just HTTP 200.
      - name: Verify version through the public API
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            version=$(curl -fsS --max-time 10 "$PUBLIC_URL/api/status" | jq -r '.version // empty' || true)
            if [ "$version" = "$SHA" ]; then
              echo "Deployed version $SHA is live."
              exit 0
            fi
            echo "Attempt $attempt: version '${version:-none}', waiting..."
            sleep 10
          done
          echo "::error::$PUBLIC_URL/api/status does not report version $SHA after 10 minutes."
          exit 1
