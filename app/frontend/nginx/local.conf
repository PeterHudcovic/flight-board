server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    include /etc/nginx/flight-board-static.conf;
    # Resolve on each request so nginx and /healthz start even while backend is absent.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;
    location = /api {
        proxy_pass $backend$request_uri;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_cache off;
    }
    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_cache off;
    }
}
