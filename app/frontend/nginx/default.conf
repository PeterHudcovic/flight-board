server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    include /etc/nginx/flight-board-static.conf;
    # GKE routes /api to the backend at the Ingress. Never return SPA HTML for API requests.
    location = /api {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":"API_UNAVAILABLE","message":"API is temporarily unavailable"}';
    }
    location /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":"API_UNAVAILABLE","message":"API is temporarily unavailable"}';
    }
}
