spring.application.name=flight-board-backend

# Explicit contract aliases: underscore-separated environment names are not inferred.
flightboard.source=${FLIGHTBOARD_SOURCE:stub}
spring.data.mongodb.database=${FLIGHTBOARD_MONGODB_DATABASE:flightboard}
flightboard.aerodatabox.base-url=${FLIGHTBOARD_AERODATABOX_BASE_URL:https://aerodatabox.p.rapidapi.com}
flightboard.aerodatabox.host=${FLIGHTBOARD_AERODATABOX_HOST:aerodatabox.p.rapidapi.com}
flightboard.aerodatabox.api-key=${AERODATABOX_API_KEY:}
flightboard.fetch.interval=${FLIGHTBOARD_FETCH_INTERVAL:PT30M}
flightboard.fetch.check-interval=${FLIGHTBOARD_FETCH_CHECK_INTERVAL:PT1M}
flightboard.fetch.lock-duration=${FLIGHTBOARD_FETCH_LOCK_DURATION:PT5M}
flightboard.fetch.run-timeout=${FLIGHTBOARD_FETCH_RUN_TIMEOUT:PT2M}
flightboard.request.airport=${FLIGHTBOARD_SOURCE_AIRPORT:PRG}
flightboard.request.offset-minutes=${FLIGHTBOARD_SOURCE_OFFSET_MINUTES:-60}
flightboard.request.duration-minutes=${FLIGHTBOARD_SOURCE_DURATION_MINUTES:720}
flightboard.board.stale-after=${FLIGHTBOARD_BOARD_STALE_AFTER:PT75M}
flightboard.board.max-age=${FLIGHTBOARD_BOARD_MAX_AGE:PT12H}
flightboard.board.terminal=${FLIGHTBOARD_BOARD_TERMINAL:2}
flightboard.board.max-flights=${FLIGHTBOARD_BOARD_MAX_FLIGHTS:36}
flightboard.board.timezone=${FLIGHTBOARD_BOARD_TIMEZONE:Europe/Prague}
flightboard.admin.port=${FLIGHTBOARD_ADMIN_PORT:8082}
flightboard.admin.address=${FLIGHTBOARD_ADMIN_ADDRESS:127.0.0.1}
flightboard.version=${FLIGHTBOARD_VERSION:development}

# Listeners are implemented in backend part 3; these values preserve the shared interface.
server.port=${SERVER_PORT:8080}
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
